[project]
name = "vision-trainer"
version = "0.1.0"
description = "Local application for training object detection models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.28.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
    "ultralytics>=8.3.0",
    "imageio-ffmpeg>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vision_trainer = ["assets/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
