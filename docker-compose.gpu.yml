# Vision Trainer — NVIDIA GPU overlay
#
# Usage (on a machine with NVIDIA drivers + Container Toolkit / Docker Desktop GPU):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
# Optional WSL bind-mount fallback remains available:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.wsl.yml up --build
#
# Prerequisites:
#   - NVIDIA GPU + recent driver
#   - Linux: NVIDIA Container Toolkit
#   - Windows: Docker Desktop with WSL2 GPU support enabled
#
# Verify inside the container:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml exec vision-trainer \
#     python -c "import torch; print(torch.cuda.is_available()); print(torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'no-gpu')"

services:
  vision-trainer:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: vision-trainer:gpu
    # Docker Compose v2+ GPU access (no privileged mode).
    gpus: all
    shm_size: "4gb"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
