# Vision Trainer — CPU-first Compose stack
#
# Launch:
#   docker compose up --build
# Open:
#   http://localhost:8501
#
# Persistent data:
#   Prefer the bind mount ./data (visible on the host).
#   If Docker Desktop + WSL fails to bind-mount the Linux home directory,
#   use the named volume profile instead:
#     docker compose -f docker-compose.yml -f docker-compose.wsl.yml up --build
#
# External / large datasets (read-only, no browser upload):
#   Default host path for WSL+Windows: /mnt/d/Datasets → /datasets
#   Change the left-hand side to match your machine, e.g.:
#     /mnt/c/Users/you/Datasets:/datasets:ro
#     /home/you/datasets:/datasets:ro
#   The app only sees /datasets (VISION_TRAINER_EXTERNAL_DATASETS).
#
# NVIDIA GPU: use the overlay file (does not replace this CPU service definition):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build

services:
  vision-trainer:
    build:
      context: .
      dockerfile: Dockerfile
    image: vision-trainer:cpu
    container_name: vision-trainer
    ports:
      - "8501:8501"
    environment:
      VISIONTRAINER_DATA_DIR: /app/data
      VISION_TRAINER_EXTERNAL_DATASETS: /datasets
      YOLO_CONFIG_DIR: /app/data/ultralytics
      TMPDIR: /app/data/tmp
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    volumes:
      # Host-persisted datasets, runs, weights, ultralytics cache, tmp uploads
      - ./data:/app/data
      # Large external datasets (read-only). Adjust host path as needed.
      - /mnt/c/Datasets:/datasets:ro
    restart: unless-stopped
